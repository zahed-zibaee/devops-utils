{% extends "base/base.html" %} {% block content %}
<div class="starter-template my-3">
  <h1>{{ title }}</h1>
  <p class="lead mb-4">{{ description }}</p>
</div>
<div class="">
  <ul class="nav nav-tabs" id="myTab" role="tablist">
    <li class="nav-item" role="presentation">
      <button
        class="nav-link active"
        id="order-tab"
        data-bs-toggle="tab"
        data-bs-target="#order"
        type="button"
        role="tab"
        aria-controls="order"
        aria-selected="true"
      >
        Order
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="schema-tab"
        data-bs-toggle="tab"
        data-bs-target="#schema"
        type="button"
        role="tab"
        aria-controls="schema"
        aria-selected="false"
      >
        Aggregation
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        class="nav-link"
        id="access-tab"
        data-bs-toggle="tab"
        data-bs-target="#access"
        type="button"
        role="tab"
        aria-controls="access"
        aria-selected="false"
      >
        Access
      </button>
    </li>
  </ul>
  <div class="tab-content mb-3 mt-4" id="myTabContent">
    <div
      class="tab-pane fade show active"
      id="order"
      role="tabpanel"
      aria-labelledby="order-tab"
    >
      <form class="my-3" method="put" enctype="multipart/form-data">
        <div class="form-floating input-wrapper">
          <input
            id="order-lock-in-days"
            type="number"
            class="form-control"
            value=""
            aria-label="lock"
            aria-describedby="basic-addon1"
            min="0"
            max="1000"
            required
            placeholder="day(s)"
          />
          <label for="order-lock-in-days">Order Lock</label>
          <span class="unit-label">day(s)</span>
        </div>
      </form>
      <div class="d-flex justify-content-end">
        <button id="upload-button" type="button" class="btn btn-primary mx-1">
          Update
        </button>
        <button id="reset-button" type="button" class="btn btn-secondary mx-1">
          Reset
        </button>
      </div>
    </div>
    <div
      class="tab-pane fade"
      id="schema"
      role="tabpanel"
      aria-labelledby="schema-tab"
    >
      <div class="d-flex justify-content-end my-3">
        <button
          id="sync-tables-button"
          type="button"
          class="btn btn-primary mx-1"
        >
          Sync Tables
        </button>
        <button
          id="sync-views-button"
          type="button"
          class="btn btn-primary mx-1"
        >
          Sync Views
        </button>
      </div>
    </div>
    <div
      class="tab-pane fade"
      id="access"
      role="tabpanel"
      aria-labelledby="access-tab"
    >
      <div class="d-flex justify-content-end my-3">
        <button
          id="access-sync-button"
          type="button"
          class="btn btn-primary mx-1"
        >
          Sync Tables
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap Toast -->
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer">
  <!-- Toasts will be dynamically added here -->
</div>

<script>
  const uploadButton = document.getElementById("upload-button");
  const resetButton = document.getElementById("reset-button");
  const syncTablesButton = document.getElementById("sync-tables-button");
  const syncSchemaButton = document.getElementById("sync-views-button");
  const syncAccessButton = document.getElementById("access-sync-button");
  var lastOrderLock = -1;
  var hostname = "";
  var token = "";

  window.addEventListener("message", function (event) {
    if (!!event.data && !!event.data.hostname && !!event.data.token) {
      hostname = event.data.hostname;
      console.log("Hostname received from the parent: " + hostname);
      token = event.data.token;
      ajaxRequestGetOrderLock();
      $("#loadOverlay").prop("style", "display: none;");
      console.log("Message received from the parent: " + event.data);
    }
  });

  uploadButton.addEventListener("click", () => {
    updateSettings();
  });

  resetButton.addEventListener("click", () => {
    resetSettings();
  });

  syncTablesButton.addEventListener("click", () => {
    syncAggregationCreate("tables");
  });

  syncSchemaButton.addEventListener("click", () => {
    syncAggregationCreate("views");
  });

  syncAccessButton.addEventListener("click", () => {
    syncAccess()
  })
</script>
{% endblock %}
