<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lock time</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #3f51b5;
        }

        p {
            margin-bottom: 10px;
            text-align: center;
            font-size: 20px;
            color: #3f51b5;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #text-box {
            border: 1px solid #ccc;
            padding: 5px;
            width: 200px;
        }

        #submit-button {
            background-color: #3f51b5;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }

        #submit-button:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .success-message {
            color: green;
            font-weight: bold;
        }
        .locked-time {
            color: #583870; /* Consider a darker green shade */
            font-style: italic;
            font-size: 20px;
            margin-top: 10px;
        }
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent overlay */
            z-index: 999; /* Position on top of other elements */
            visibility: hidden; /* Initially hidden */
        }

        .loading-icon {
            border: 16px solid #f3f3f3; /* Loader border */
            border-radius: 50%;
            border-top: 16px solid purple; /* Animated part */
            width: 80px;
            height: 80px;
            -webkit-animation: spin 2s linear infinite; /* Animation for spinning */
            animation: spin 2s linear infinite;
        }

        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Order lock time</h1>
    <p>Enter a lock time:</p>
    <form action="https://{{ url_for('receive_days') }}" method="post">
        <input type="text" name="text" id="text-box">
        <br>
        <button type="submit" id="submit-button" disabled>Lock</button>
    </form>
    <div class="loading-container">
        <div class="loading-icon"></div>
    </div>
    <p class="locked-time">Current locked time: {{ locked_time }}</p>
    <div id="success-message"></div>
    <script>
        const textBox = document.getElementById("text-box");
        const submitButton = document.getElementById("submit-button");
        const successMessage = document.getElementById("success-message");

        textBox.addEventListener("input", () => {
            const text = textBox.value.trim();
            if (text && !isNaN(text)) {  // Check for non-empty and valid integer
                submitButton.disabled = false;
            } else {
                submitButton.disabled = true;
            }
        });

        const form = document.querySelector("form");
        form.addEventListener("submit", async (event) => {
            event.preventDefault(); // Prevent default form submission

            const response = await fetch(event.target.action, {
                method: "POST",
                body: JSON.stringify({ text: textBox.value })
            });

            if (response.ok) {
                successMessage.textContent = "Successfully changed lock time.";
                successMessage.classList.add("success-message");
                successMessage.style.color = "green"; // Ensure green color on success
            } else {
                successMessage.textContent = `Error: ${response.statusText}`;
                successMessage.classList.remove("success-message"); 
                successMessage.style.color = "red"; 
            }
        });
        // Add event listeners for loading and response received
        const loadingContainer = document.querySelector(".loading-container");

        form.addEventListener("submit", async (event) => {
            event.preventDefault(); // Prevent default form submission

            showLoading(); // Show loading indicator

            const response = await fetch(event.target.action, {
                method: "POST",
                body: JSON.stringify({ text: textBox.value })
            });

            hideLoading(); // Hide loading indicator

            // ... (existing response handling code)
        });

        function showLoading() {
            loadingContainer.style.visibility = "visible";
        }

        function hideLoading() {
            loadingContainer.style.visibility = "hidden";
        }
    </script>
</body>
</html>
