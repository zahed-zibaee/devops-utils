<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.4/dist/bootstrap-table.min.css"
      rel="stylesheet" 
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.4/dist/bootstrap-table.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.4/dist/bootstrap-table-locale-all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.4/dist/extensions/export/bootstrap-table-export.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tableexport.jquery.plugin@1.28.0/tableExport.min.js"></script>
  </head>
  <body>
    <script>
      $(document).ready( function() {
        $("#loadOverlay").attr("class", "d-none");
      });
    </script>
    <div id="loadOverlay" style="
      display: flex;
      background-color:#f1f1f1;
      filter: alpha(opacity=85);
      -moz-opacity: 0.85;
      opacity: 0.85;
      position: fixed; 
      top: 0px; 
      left: 0px; 
      width:100%; 
      height:100%; 
      z-index:2000;
      font-family: var(--bs-font-sans-serif);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: #212529;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      flex-direction: column!important;
      justify-content: center!important;
      align-items: center!important;
      ">
    <h3 >Loading...</h3>
    <div style="
      font-family: var(--bs-font-sans-serif);
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      display: inline-block;
      width: 2rem;
      height: 2rem;
      vertical-align: -.125em;
      border: .25em solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: .75s linear infinite spinner-border;
      color: #ffc107!important;
      filter: alpha(opacity=100);
      -moz-opacity: 100;
      opacity: 100;
    ">
    </div>
    </div>
    <style>
      .select,
      #locale {
        width: 100%;
      }
    </style>
    <div aria-live="polite" aria-atomic="true" class="position-relative">
      <!-- Position it: -->
      <!-- - `.toast-container` for spacing between toasts -->
      <!-- - `.position-absolute`, `top-0` & `end-0` to position the toasts in the upper right corner -->
      <!-- - `.p-3` to prevent the toasts from sticking to the edge of the container  -->
      <div class="toast-container position-absolute top-0 end-0 p-3">
        <div id="toast" class="toast align-items-center text-back bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
          <div class="d-flex">
            <div class="toast-body">
              Error update products!
            </div>
            <button type="button" class="btn-close btn-close-black me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        </div>
      </div>
    </div>
    <div class="select d-none">
      <select class="form-control" id="locale">
        <option value="en-US" selected>en-US</option>
      </select>
    </div>
    <h2 class="m-5">Products tax rate and moadian ID list</h2>
    <form class="m-3" id="upload-form" method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label for="formFile" class="form-label">Update Data...</label>
      <input id="csv-file" class="form-control" type="file" id="formFile" accept=".csv" required>
    </div>
    <button id="upload-button" type="button" class="btn btn-light" >Upload</button>
    </form>
    
    <div class="m-3">
    <table
      id="table"
      data-toolbar="#toolbar"
      data-search="true"
      data-show-refresh="false"
      data-show-toggle="false"
      data-show-fullscreen="false"
      data-show-columns="true"
      data-show-columns-toggle-all="false"
      data-detail-view="false"
      data-show-export="true"
      data-click-to-select="false"
      data-minimum-count-columns="2"
      data-show-pagination-switch="false"
      data-pagination="true"
      data-id-field="ID"
      data-page-list="[10, 50, 100, 500, all]"
      data-side-pagination="client"
      data-search-highlight="true"
      data-show-search-button="true"
      data-show-search-clear-button="true"
      data-unique-id="ID"
      data-show-extended-pagination"true"
      data-show-columns-search="true"
      data-sortable="false"
    >
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Tax Rate</th>
          <th>Moadian Product ID</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for product in products %}
        <tr>
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.tax_rate }}</td>
          <td>{{ product.moadian_product_id }}</td>
          <td>{{ product.status }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    </div>
    <script>
      const csvFile = document.getElementById('csv-file');
      const uploadButton = document.getElementById('upload-button');
      const toastLiveExample = document.getElementById('toast');
      const toast = new bootstrap.Toast(toastLiveExample);

      uploadButton.addEventListener('click', () => {
        $("#loadOverlay").attr("class", "d-flex");
        var file = csvFile.files[0];
        if (!file) {
          toast.show();
          $("#loadOverlay").attr("class", "d-none");
        }
        var formData = new FormData();
        formData.append('file', file);
        fetch('/products/tax_and_moadian/import', {
          method: 'POST',
          body: formData
        })
        .then(response => {
          if (response.ok) {
            location.reload();
          } else {
            $("#loadOverlay").attr("class", "d-none");
            toast.show();
            console.error("Error:", data);
          }
        })
        .catch(error => {
          toast.show();
          console.error("Error:", error);
        });
      });
  </script>
    <script>
      var $table = $("#table");

      function responseHandler(res) {
        $.each(res.rows, function (i, row) {
          row.state = $.inArray(row.id, selections) !== -1;
        });
        return res;
      }
      
      function initTable() {
        $table.bootstrapTable("destroy").bootstrapTable({
          height: 550,
          locale: $("#locale").val(),
        });
      }

      $(function () {
        initTable();

        $("#locale").change(initTable);
      });
    </script>
    
  </body>
</html>
